# Ours V1.1 candidate: final V1 plus link-hand clearance shaping.
robot:
  name: Schunk
  controller_config_path: controllers/failsafe_controller/config/failsafe.json
  robot_config_path: models/robots/config/schunk.json

environment:
  env_id: ReactiveHumanHandoverCartV1
  robot_base_offset: [0.0, 0.0, 0.0]
  env_configuration: default
  controller_configs: null
  gripper_types: default
  initialization_noise: default
  use_camera_obs: false
  use_object_obs: true
  has_renderer: false
  has_offscreen_renderer: false
  render_camera: null
  render_collision_mesh: false
  render_visual_mesh: true
  render_gpu_device_id: -1
  control_freq: 10
  horizon: 1000
  ignore_done: false
  hard_reset: false
  camera_names: frontview
  camera_heights: 256
  camera_widths: 256
  camera_depths: false
  camera_segmentations: null
  renderer: mujoco
  renderer_config: null

  shield_type: PFL
  visualize_failsafe_controller: false
  visualize_pinocchio: false
  control_sample_time: 0.004
  safe_vel: 0.001
  self_collision_safety: 0.01
  collision_debounce_delay: 0.01

  human_animation_names:
    - RobotHumanHandover/0
    - RobotHumanHandover/1
    - RobotHumanHandover/2
    - RobotHumanHandover/3
    - RobotHumanHandover/4
    - RobotHumanHandover/5
    - RobotHumanHandover/6
    - RobotHumanHandover/7
    - RobotHumanHandover/8
  base_human_pos_offset: [0.0, 0.0, 0.0]
  human_animation_freq: 90
  human_rand: [0.0, 0.2, 0.1]
  n_animations_sampled_per_100_steps: 2

  table_full_size: [1.5, 2.0, 0.05]
  table_friction: [1.0, 0.005, 0.0001]
  seed: ${run.seed}
  verbose: false

  reward_scale: 1.0
  reward_shaping: true
  goal_dist: 0.06
  collision_reward: -1.0
  task_reward: 20.0
  object_gripped_reward: 0.0
  object_in_human_hand_reward: 20.0
  done_at_collision: true
  done_at_success: true
  n_object_placements_sampled_per_100_steps: 3
  object_placement_initializer: null
  obstacle_placement_initializer: null

  speed_min: 0.001
  speed_scale: 2.0
  max_transport_dist: 0.5

  v1_step_penalty: 0.01
  v1_approach_progress_scale: 2.0
  v1_transport_progress_scale: 4.0
  v1_grasp_bonus: 2.0
  v1_drop_penalty: 4.0
  v1_success_reward: 20.0
  v1_capture_bonus: 5.0
  v1_max_progress_per_step: 0.05
  v1_capture_surface_dist: 0.12
  v1_require_release: true
  v1_release_hold_steps: 5
  v1_release_aperture_threshold: 0.02
  v1_release_supervisor: false
  v1_gate_human_approach_until_grasp: false
  v1_human_yield_distance: 0.0
  v1_cooperative_human_reach: true
  v1_cooperative_reach_target_dist: 0.10
  v1_cooperative_reach_max_offset: 0.10
  v1_cooperative_reach_step: 0.002
  v1_cooperative_reach_delay_steps: 100
  v1_link_hand_clearance_margin: 0.06
  v1_link_hand_clearance_penalty: 0.20
  v1_link_hand_clearance_link_names: "robot0_link_4_collision,robot0_link_5_collision"

wrappers:
  collision_prevention:
    replace_type: 3
    n_resamples: 20
  ik_position_delta:
    urdf_file: models/assets/robots/schunk/robot_pybullet.urdf
    action_limit: 0.05
    x_output_max: 1
    x_position_limits: null
    residual_threshold: 0.001
    max_iter: 50
  human_aware_action_governor:
    activation_distance: 0.22
    hard_distance: 0.18
    prediction_horizon: 1.0
    minimum_scale: 0.25
    max_interventions: 75
  state_based_expert_imitation_reward:
    dataset_name: ${run.dataset_name}
    alpha: 0.05
    observe_time: false
    rsi_prob: 0.2
    use_et: false
    verbose: false
    beta: 0.7
    iota_m: 0.1
    iota_g: 0.01
    m_sim_fn: gaussian
    g_sim_fn: gaussian
    et_dist: 6
  dataset_obs_norm:
    dataset_name: ${run.dataset_name}
    squash_factor: null
    allow_different_observation_shapes: true
    mean: null
    std: null
  failsafe_penalty:
    penalty: 0.002

algorithm:
  name: SAC
  policy: MlpPolicy
  learning_rate: 0.00001
  buffer_size: 1000000
  learning_starts: 0
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  train_freq: [1, step]
  gradient_steps: 1
  replay_buffer_kwargs: null
  optimize_memory_usage: false
  ent_coef: 0.001
  target_update_interval: 1
  target_entropy: -2.0
  use_sde: false
  sde_sample_freq: -1
  use_sde_at_warmup: false
  create_eval_env: false
  policy_kwargs:
    net_arch: [256, 256]
  verbose: 1
  seed: ${run.seed}
  device: auto
  _init_setup_model: true
  action_noise: null

expert:
  id: PickPlaceHumanCart
  signal_to_noise_ratio: 0.98
  hover_dist: 0.2
  tan_theta: 0.5
  horizontal_epsilon: 0.035
  vertical_epsilon: 0.015
  goal_dist: 0.08
  gripper_fully_opened_threshold: 0.02
  release_when_delivered: true
  delta_time: 0.01
  seed: ${run.seed}
  obs_keys:
    - object_gripped
    - vec_eef_to_object
    - vec_eef_to_target
    - robot0_gripper_qpos

run:
  n_envs: 1
  n_steps: 500001
  save_freq: 200000
  test_only: false
  load_step: null
  id: null
  type: tensorboard
  log_interval: [8000, step]
  seed: null
  eval_seed: null
  start_index: 0
  n_test_episodes: 1
  env_type: env
  obs_keys:
    - object_gripped
    - vec_eef_to_object
    - vec_eef_to_target
    - gripper_aperture
    - dist_eef_to_human_head
    - dist_eef_to_human_lh
    - dist_eef_to_human_rh
  expert_obs_keys: ${expert.obs_keys}
  log_info_keys:
    - n_goal_reached
    - collision
    - collision_type
    - n_collisions
    - n_collisions_static
    - n_collisions_robot
    - n_collisions_human
    - n_collisions_critical
    - timeout
    - failsafe_interventions
    - action_resamples
    - v1_capture_count
    - v1_drop_count
    - v1_object_captured
    - v1_release_hold_count
    - v1_release_count
    - v1_release_confirmed
    - v1_release_supervisor_steps
    - v1_human_approach_released
    - v1_human_yield_steps
    - v1_cooperative_reach_steps
    - v1_cooperative_reach_offset
    - v1_cooperative_reach_ready_steps
    - v1_reachout_human_yield_steps
    - v1_min_link_hand_clearance
    - v1_link_hand_clearance_penalty
    - v1_link_hand_clearance_violations
    - human_governor_interventions
    - human_governor_last_scale
    - human_governor_mean_scale
    - human_governor_min_predicted_distance
    - human_governor_budget_exhausted
    - im_rew_mean
    - env_rew_mean
    - full_rew_mean
    - ep_im_rew_mean
    - ep_env_rew_mean
    - ep_full_rew_mean
    - g_im_rew_mean
    - m_im_rew_mean
    - ep_g_im_rew_mean
    - ep_m_im_rew_mean
    - early_termination
  monitor_dir: null
  vec_env_kwargs: null
  monitor_kwargs: null
  verbose: true
  resetting_interval: null
  dataset_name: reactive-human-handover-v1-bc-success
  behavior_cloning: true
  bc_dataset_name: reactive-human-handover-v1-bc-dagger-v4-strict
  bc_epochs: 120
  bc_batch_size: 512
  bc_learning_rate: 0.0003
  bc_validation_fraction: 0.1
  bc_log_std_target: -3.0
  bc_log_std_weight: 0.01
  sac_warm_start: true
  sac_replay_prefill_steps: 10000
  sac_critic_warmup_steps: 10000
  sac_actor_learning_rate: 0.00001
  sac_freeze_actor: true
  rsi_curriculum: true
  rsi_curriculum_mode: linear
  rsi_start: 0.2
  rsi_floor: 0.05
  rsi_end_fraction: 0.8
  reactivity_curriculum: false
  reactivity_curriculum_mode: linear
  reactivity_start_fraction: 0.0
  reactivity_end_fraction: 0.7
  reactivity_max_speed_scale: 2.0

wandb_run:
  project: icra_2024
  entity: null
  group: RHH_SIR_reactive_v1_clearance
  name: run_${run.seed}
  tags: [ours-v1-clearance, reactive, safe-handover, strict-release, predictive-governor, cooperative-human, robust-capture, link-hand-clearance]
